# Example nginx site for a Linux server (Ubuntu). Replace alitravel.uz with your domain and the paths with yours.
# Get a free certificate with:  sudo certbot --nginx -d alitravel.uz -d www.alitravel.uz
server {
    listen 80;
    server_name alitravel.uz www.alitravel.uz;
    return 301 https://alitravel.uz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name alitravel.uz www.alitravel.uz;

    ssl_certificate     /etc/letsencrypt/live/alitravel.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alitravel.uz/privkey.pem;

    client_max_body_size 12M;                      # photo uploads from the admin panel

    root /var/www/alitravel/frontend/dist;         # the output of `npm run build`
    index index.html;

    # The API, sitemap and robots.txt are served by Django (gunicorn).
    location /api/        { proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8000; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto $scheme; }

    # Uploaded photos
    location /media/ {
        alias /var/www/alitravel/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Built, fingerprinted files can be cached for a long time
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Every other address belongs to the React app
    location / {
        try_files $uri /index.html;
    }
}
